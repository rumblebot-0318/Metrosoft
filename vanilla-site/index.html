<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metrosoft | Vanilla</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="#home"><img src="assets/metrologo.png" alt="Metrosoft" /></a>
      <nav class="nav" data-nav></nav>
      <div class="locale-switcher">
        <button data-locale="ko">한국어</button>
        <button data-locale="en">English</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero" id="home">
      <p class="hero__badge">Metrosoft</p>
      <h1 class="hero__title" data-hero-title></h1>
      <p class="hero__text" data-hero-description></p>
      <button class="hero__cta" data-hero-cta></button>
    </section>

    <section class="metrics" data-metrics></section>

    <section class="spotlight" id="business">
      <div class="spotlight__text">
        <p class="spotlight__eyebrow" data-spotlight-eyebrow></p>
        <h2 data-spotlight-title></h2>
        <p data-spotlight-description></p>
        <ul data-spotlight-points></ul>
      </div>
      <div class="spotlight__visual"><img src="assets/businessContent.png" alt="Business content" /></div>
    </section>

    <section class="section" id="highlights">
      <h2 data-title="highlights"></h2>
      <p class="section-sub" data-sub="highlights"></p>
      <div class="cards" data-highlights></div>
    </section>

    <section class="section" id="product">
      <h2 data-title="product"></h2>
      <p class="section-sub" data-sub="product"></p>
      <div class="cards" data-product></div>
    </section>

    <section class="section" id="product-detail">
      <h2 data-product-table-title>Product Detailed Composition</h2>
      <p class="section-sub" data-product-table-sub>기존 OCS 구성표를 그대로 재현한 상세 영역</p>
      <div class="table-wrap">
        <table class="legacy-table" data-product-table></table>
      </div>
      <div class="image-grid" data-product-images></div>
    </section>

    <section class="section" id="introduce">
      <h2 data-title="introduce"></h2>
      <p class="section-sub" data-sub="introduce"></p>
      <div class="cards" data-introduce></div>
    </section>

    <section class="section" id="customer">
      <h2 data-title="customer"></h2>
      <p class="section-sub" data-sub="customer"></p>
      <div class="cards" data-customer></div>
      <div class="table-wrap">
        <table class="legacy-table" data-customer-table></table>
      </div>
    </section>

    <section class="section" id="hospital-logos">
      <h2 data-hospital-title>주요 고객사 병원</h2>
      <p class="section-sub" data-hospital-sub>기존 컴포넌트에서 사용하던 병원 아이콘을 그대로 표시합니다.</p>
      <div class="hospital-grid" data-hospital-grid></div>
    </section>

    <section class="cta-band">
      <h3 data-cta-title></h3>
      <p data-cta-description></p>
      <button data-cta-button></button>
    </section>

    <p class="footer-note">© Metrosoft Vanilla Preview</p>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
